name: "Setup Key Environment"
description: "Create key.properties and decode signed key file"

inputs:
  key-properties:
    description: "key.properties content"
    required: true
  key-file:
    description: "Base64 encoded signed key file (.jks/.keystore)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Create key.properties and signed key
      shell: bash
      run: |
        set -euo pipefail

        # Option B: key.properties lives at repo root, but Gradle resolves `storeFile`
        # relative to the app module directory. Standardize on `./key.jks` => `app/key.jks`.
        printf '%s' '${{ inputs.key-properties }}' > ./key.properties
        if grep -Eq '^[[:space:]]*storeFile[[:space:]]*=' ./key.properties; then
          # Replace any existing storeFile with the standardized relative path.
          sed -i.bak -E 's|^[[:space:]]*storeFile[[:space:]]*=.*$|storeFile=./key.jks|' ./key.properties
          rm -f ./key.properties.bak
        else
          printf '\nstoreFile=./key.jks\n' >> ./key.properties
        fi

        mkdir -p ./app
        printf '%s' '${{ inputs.key-file }}' | base64 --decode > ./app/key.jks
        test -s ./app/key.jks
