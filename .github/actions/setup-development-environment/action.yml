name: "Setup Development Environment"
description: "Set up Java/Gradle and create development config files"

inputs:
  google-services:
    description: "Base64 encoded google-services.json"
    required: true
  local-properties:
    description: "local.properties content"
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        distribution: "temurin"
        java-version: "17"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Create google-services.json
      shell: bash
      run: printf '%s' '${{ inputs.google-services }}' | base64 --decode > ./app/google-services.json

    - name: Create local.properties
      shell: bash
      run: printf '%s' '${{ inputs.local-properties }}' > ./local.properties
