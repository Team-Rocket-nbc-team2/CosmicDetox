name: "[CI] Build Check and Notify"

on:
  pull_request:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES }}' | base64 --decode > ./app/google-services.json

      - name: Create local.properties
        run: echo '${{ secrets.LOCAL_PROPERTIES }}' > ./local.properties

      - name: Create key.properties
        run: touch ./app/key.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug
        run: ./gradlew :app:assembleDebug

  notify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Send to Slack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          declare -A SLACK_MAP
          SLACK_MAP["seojw0124"]="U0AH1TA9RSN"

          PR_NUMBER=${{ github.event.pull_request.number }}
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"

          AUTHOR_SLACK="${SLACK_MAP[$PR_AUTHOR]}"
          if [ -n "$AUTHOR_SLACK" ]; then
            AUTHOR_MENTION="<@$AUTHOR_SLACK>"
          else
            AUTHOR_MENTION="$PR_AUTHOR"
          fi

          REVIEWER_LOGINS=$(gh pr view $PR_NUMBER --repo ${{ github.repository }} --json reviewRequests --jq '[.reviewRequests[].login] | .[]')

          MENTIONS=""
          for LOGIN in $REVIEWER_LOGINS; do
            SLACK_ID="${SLACK_MAP[$LOGIN]}"
            if [ -n "$SLACK_ID" ]; then
              MENTIONS="$MENTIONS <@$SLACK_ID>"
            else
              MENTIONS="$MENTS $LOGIN"
            fi
          done

          if [ -z "$MENTIONS" ]; then
            MENTIONS="없음"
          fi

          curl -X POST \
            -H 'Content-type: application/json' \
            --data '{
              "text": "📢 *PR 알림*\n*제목:* '"${PR_TITLE}"' (#'"${PR_NUMBER}"')\n*작성자:* '"${AUTHOR_MENTION}"'\n*리뷰어:* '"${MENTIONS}"'\n*링크:* '"${PR_URL}"'"
            }' \
            ${{ secrets.SLACK_WEBHOOK_URL }}