name: "[CD] Debug to Firebase Distribution"

on:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: cd-firebase-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy_debug:
    runs-on: ubuntu-latest
    environment: Debug

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Development Environment
        uses: ./.github/actions/setup-development-environment
        with:
          google-services: ${{ secrets.GOOGLE_SERVICES }}
          local-properties: ${{ secrets.LOCAL_PROPERTIES }}

      - name: Setup Key Environment
        uses: ./.github/actions/setup-key-environment
        with:
          key-properties: ${{ secrets.KEY_PROPERTIES }}
          key-file: ${{ secrets.SIGNED_KEY }}

      - name: Build release notes from git
        id: release_notes
        shell: bash
        run: |
          HASH="$(git rev-parse --short=8 HEAD)"
          MSG="$(git show -s --format=%B | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' | sed 's/^ //; s/ $//')"
          echo "text=[$HASH] $MSG" >> "$GITHUB_OUTPUT"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Check if APK exists
        run: ls -la app/build/outputs/apk/debug/

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_CREDENTIALS }}
          groups: developers
          file: app/build/outputs/apk/debug/app-debug.apk
          releaseNotes: ${{ steps.release_notes.outputs.text }}
