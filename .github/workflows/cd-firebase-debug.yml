name: "[CD] Debug to Firebase Distribution"

on:
  push:
    branches:
      - dev2

permissions:
  contents: read

concurrency:
  group: cd-firebase-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy_debug:
    runs-on: ubuntu-latest
    environment: Debug

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create google-services.json
        run: printf '%s' '${{ secrets.GOOGLE_SERVICES }}' | base64 --decode > ./app/google-services.json

      - name: Create local.properties
        run: printf '%s' '${{ secrets.LOCAL_PROPERTIES }}' > ./local.properties

      - name: Create key.properties and signed key file
        run: |
          set -euo pipefail

          printf '%s' '${{ secrets.KEY_PROPERTIES }}' > ./app/key.properties

          STORE_FILE_PATH="$(grep -E '^storeFile=' ./app/key.properties | head -n1 | cut -d'=' -f2- | tr -d '\r')"
          if [ -z "$STORE_FILE_PATH" ]; then
            STORE_FILE_PATH="./app/release-key.jks"
          fi

          mkdir -p "$(dirname "$STORE_FILE_PATH")"
          printf '%s' '${{ secrets.SIGNED_KEY }}' | base64 --decode > "$STORE_FILE_PATH"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Check if APK exists
        run: ls -la app/build/outputs/apk/debug/

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_CREDENTIALS }}
          groups: developers
          file: app/build/outputs/apk/debug/app-debug.apk
          releaseNotes: "[${{ github.sha }}] ${{ github.event.head_commit.message }}"
