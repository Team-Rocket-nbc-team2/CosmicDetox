name: PR Slack 알림

on:
  workflow_run:
    workflows: ["[CI] Build Check"]
    types:
      - completed

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Send to Slack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          declare -A SLACK_MAP
          SLACK_MAP["seojw0124"]="U0AH1TA9RSN"

          PR_NUMBER=${{ github.event.workflow_run.pull_requests[0].number }}
          PR_TITLE="${{ github.event.workflow_run.pull_requests[0].title }}"
          PR_URL="${{ github.event.workflow_run.pull_requests[0].url }}"
          PR_AUTHOR="${{ github.event.workflow_run.actor.login }}"

          AUTHOR_SLACK="${SLACK_MAP[$PR_AUTHOR]}"
          if [ -n "$AUTHOR_SLACK" ]; then
            AUTHOR_MENTION="<@$AUTHOR_SLACK>"
          else
            AUTHOR_MENTION="$PR_AUTHOR"
          fi

          REVIEWER_LOGINS=$(gh pr view $PR_NUMBER --repo ${{ github.repository }} --json reviewRequests --jq '[.reviewRequests[].login] | .[]')

          MENTIONS=""
          for LOGIN in $REVIEWER_LOGINS; do
            SLACK_ID="${SLACK_MAP[$LOGIN]}"
            if [ -n "$SLACK_ID" ]; then
              MENTIONS="$MENTIONS <@$SLACK_ID>"
            else
              MENTIONS="$MENTIONS $LOGIN"
            fi
          done

          if [ -z "$MENTIONS" ]; then
            MENTIONS="없음"
          fi

          curl -X POST \
            -H 'Content-type: application/json' \
            --data '{
              "text": "📢 *PR 알림*\n*제목:* '"${PR_TITLE}"' (#'"${PR_NUMBER}"')\n*작성자:* '"${AUTHOR_MENTION}"'\n*리뷰어:* '"${MENTIONS}"'\n*링크:* '"${PR_URL}"'"
            }' \
            ${{ secrets.SLACK_WEBHOOK_URL }}