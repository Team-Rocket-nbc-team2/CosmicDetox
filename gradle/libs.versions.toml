[versions]
agp = "8.13.2"
kotlin = "2.2.21"
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.13.0"
activity = "1.13.0"
constraintlayout = "2.2.1"
navigation = "2.9.7"
googleService = "4.4.4"
firebaseBom = "34.11.0"
core = "1.18.0"
ksp = "2.2.21-2.0.4"
hilt = "2.57.2"
glide = "5.0.5"
playServicesAuth = "21.5.1"
credentialsPlayServicesAuth = "1.5.0"
googleid = "1.2.0"
kakaoV2User = "2.23.2"
lifecycleService = "2.10.0"
viewpager2 = "1.1.0"

# Room
room = "2.8.4"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "viewpager2" }
firebase-storage = { module = "com.google.firebase:firebase-storage" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
